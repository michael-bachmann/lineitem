name: Release

# Ship a store release: verify, build, submit to both stores, then tag.
#
# Deliberately `workflow_dispatch` — not tag-push, not release-please. A store
# submission can't be unsent, so the trigger is a human pressing a button after
# the version-bump PR has merged. The version itself is NOT an input: it's read
# from apps/extension/package.json (the same field WXT compiles into the
# manifest), so there's exactly one place to bump and no way to tag a number
# that differs from what shipped.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate store auth without uploading, tagging, or submitting"
        type: boolean
        default: false
      # Recovery hatch. A store submission can't be undone, so once Chrome has
      # accepted v1.2.0 it will reject a second upload of it forever — leaving a
      # re-run of "both" permanently red and unable to reach the tag step. Pick
      # the store that still needs submitting instead.
      stores:
        description: "Which stores to submit to (pick one to retry after a partial failure)"
        type: choice
        options: [both, chrome, firefox]
        default: both

# Tagging + creating the GitHub release needs write; the default is read.
permissions:
  contents: write

# Never let two releases interleave, and never cancel one midway — a submission
# that's already in flight to a store can't be rolled back by cancelling the job.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the tag-exists check below sees existing tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Read the version first and bail immediately if it already shipped —
      # catches the "forgot to bump" case before spending a build on it, and
      # before a duplicate submission reaches either store.
      - name: Resolve version
        id: version
        run: |
          version=$(node -p "require('./apps/extension/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists — bump the version in apps/extension/package.json"
            exit 1
          fi

      # Same gates as CI. They run before anything leaves the runner, so a
      # failing test can't produce a tag or a store submission.
      - name: Typecheck
        run: pnpm --filter extension compile
      - name: Unit tests
        run: pnpm --filter extension test:run

      # A fresh checkout has no untracked files, so the Firefox sources zip
      # (which sweeps the working tree, not the git tree) can only ever contain
      # committed code. That property is the reason this job exists.
      - name: Build Chrome zip
        run: pnpm --filter extension zip
      # The AMO sources zip is emitted by the Firefox build, not the Chrome one.
      - name: Build Firefox zip + AMO sources zip
        run: pnpm --filter extension zip:firefox

      # Assign each path to its own variable before echoing it. `echo "$(ls …)"`
      # swallows a glob miss — echo returns 0, set -e never fires, and the step
      # emits a bare directory path. That gets past the submit tool too, whose
      # existence check is an lstat that succeeds on a directory, so a --dry-run
      # would pass with bogus paths and only the real upload would break. An
      # assignment does inherit the substitution's exit status, so this fails.
      - name: Collect artifacts
        id: zips
        run: |
          cd apps/extension/.output
          ls -la *.zip
          chrome=$(ls *-chrome.zip)
          firefox=$(ls *-firefox.zip)
          sources=$(ls *-sources.zip)
          {
            echo "chrome=$PWD/$chrome"
            echo "firefox=$PWD/$firefox"
            echo "sources=$PWD/$sources"
          } >> "$GITHUB_OUTPUT"

      # Keep the built zips when a later step fails, so a submission that errored
      # can be finished by hand from the exact artifacts CI produced. Download
      # them BEFORE pressing re-run — GitHub deletes a run's earlier attempts'
      # artifacts as soon as a new attempt starts.
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.tag }}
          path: apps/extension/.output/*.zip
          retention-days: 30

      # Credentials come from env (publish-browser-extension reads these names
      # directly) rather than flags, so nothing sensitive lands in the command
      # line.
      #
      # --dry-run checks credentials only: a real OAuth exchange for Chrome, an
      # authenticated add-on GET for Firefox. It does NOT verify upload
      # permission, read the zips, or touch CHROME_EXTENSION_ID at all — a wrong
      # Chrome extension ID passes a dry run and fails the real submit.
      # One step per store rather than a single two-store call. `wxt submit`
      # fans out concurrently with exitOnError: false, so a half-failure leaves
      # one store submitted and the run red — and every re-run of both stays red
      # on the duplicate upload, so the tag step is never reachable. Split, these
      # are independently re-runnable via the `stores` input. The tool skips any
      # store whose zip it wasn't given, so each step only ever talks to one.
      #
      # Each step gets only its own store's credentials, so a Chrome failure
      # can't surface a Firefox secret and vice versa.
      - name: Submit to Chrome Web Store
        if: ${{ inputs.stores == 'both' || inputs.stores == 'chrome' }}
        run: |
          pnpm --filter extension exec wxt submit \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            --chrome-zip "${{ steps.zips.outputs.chrome }}"
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Submit to Firefox AMO
        if: ${{ inputs.stores == 'both' || inputs.stores == 'firefox' }}
        run: |
          pnpm --filter extension exec wxt submit \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            --firefox-zip "${{ steps.zips.outputs.firefox }}" \
            --firefox-sources-zip "${{ steps.zips.outputs.sources }}"
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

      # Tag last, and only on a real run: the tag means "this is what shipped".
      # If the submit failed, no tag is written, so re-running after a fix isn't
      # blocked by the tag-exists check above.
      #
      # Pushing the tag is its own step, immediately after the submit, and is
      # deliberately the cheapest thing that can follow it. The dangerous window
      # is "submitted but unrecorded" — a re-run in that state sails past the
      # tag-exists check and submits to both stores a second time. Keeping the
      # tag push separate from the release API call shrinks that window to a
      # single git push, and leaves the release step independently retryable.
      #
      # Only a full `both` run tags: after a single-store retry the other half
      # shipped in a previous run, which this job can't verify, and a tag that
      # claims a release that only reached one store is worse than no tag. Tag
      # by hand once the retry lands — see "Releasing" in the README.
      - name: Tag the released commit
        if: ${{ !inputs.dry_run && inputs.stores == 'both' }}
        run: |
          git tag "${{ steps.version.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: GitHub release
        if: ${{ !inputs.dry_run && inputs.stores == 'both' }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            apps/extension/.output/*.zip
        env:
          GH_TOKEN: ${{ github.token }}
