version: 2
updates:
  # pnpm workspace: one entry covers the root manifest plus every package
  # under apps/* and packages/*.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
    schedule:
      interval: "weekly"
    groups:
      # One PR for all minor + patch bumps across every directory.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # One PR for all major bumps, kept apart from the low-risk group.
      major:
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
